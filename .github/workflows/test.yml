name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: unit + integration (bash + python3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python test deps
        # Without jsonschema, validate_structured_outputs.py silently downgrades to
        # "lightweight structured checks" and does NOT fail — i.e. a green CI would
        # mean "weak checks passed", not "schema validation passed".
        run: python3 -m pip install --upgrade 'jsonschema>=4.18'

      - name: Show tool versions
        run: |
          bash --version | head -1
          python3 --version
          python3 -c "import jsonschema; print('jsonschema', jsonschema.__version__)"

      - name: Run static safety lints
        # These 6+ lint groups carry the product's safety assertions and had never
        # run in CI — they were enforced only by "remember to run it locally".
        run: bash tests/eval/run.sh

      - name: Run unit tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          failed=0
          for f in tests/unit/*.sh; do
            echo "::group::$f"
            if bash "$f"; then
              echo "PASS: $f"
            else
              echo "::error file=$f::unit test failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Run integration tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          failed=0
          for f in tests/integration/*.sh; do
            echo "::group::$f"
            if bash "$f"; then
              echo "PASS: $f"
            else
              echo "::error file=$f::integration test failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
