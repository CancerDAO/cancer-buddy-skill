# Nasopharyngeal Carcinoma (NPC) — minimum data checklist
# Used by cancer-buddy-organize to generate missing_items.json
# Driven by NCCN Head and Neck Cancers 2024 + CSCO 鼻咽癌 2024

cancer_type: NPC
version: NPC-v1
last_updated: 2026-06-13
sources:
  - "NCCN Head and Neck Cancers v4.2024 (Nasopharynx)"
  - "CSCO 鼻咽癌诊疗指南 2024"
  - "AJCC 8th Edition NPC Staging"

# Items listed by stage context. The synthesis worker picks the closest-fit
# stage_context and unions any "all" items.
# Stage contexts: early (I-II) | locally-advanced (III-IVA) | metastatic (IVB/复发转移)

stages:
  all:
    - item: "鼻咽镜活检病理 (含 WHO 组织学类型)"
      priority: P0
      category: pathology
      reason: "诊断 (非角化型 / 角化型 / 基底样) + 治疗基础"
    - item: "鼻咽 + 颈部 MRI 增强"
      priority: P0
      category: imaging
      reason: "原发灶 + 颅底侵犯 + 颈部淋巴结的 T/N 分期金标准"
    - item: "血浆 EBV DNA 拷贝数 (定量, 治疗前)"
      priority: P0
      category: lab
      reason: "诊断辅助 + 预后分层 + 疗效与复发监测核心标志物"
    - item: "EBV 血清学 (VCA-IgA / EA-IgA) 或原位 EBER"
      priority: P1
      category: lab
      reason: "病因学确认 (EBV 相关) + 辅助诊断"
    - item: "血常规 + 肝肾功能"
      priority: P1
      category: lab
      reason: "放化疗安全评估"
    - item: "ECOG / PS 评分 + 口腔 / 牙科评估"
      priority: P1
      category: history
      reason: "治疗方案选择 + 放疗前牙科处理 (防放射性骨坏死)"

  early:
    - item: "胸部 CT (排除远处转移基线)"
      priority: P1
      category: imaging
      reason: "全身分期基线 (I-II 期转移风险低但需排除)"
    - item: "听力 / 甲状腺功能基线"
      priority: P2
      category: lab
      reason: "放疗 / 顺铂耳毒性 + 放射性甲减基线"
    - item: "知情同意书 (放疗 / 同步放化疗)"
      priority: P2
      category: consent
      reason: "II 期是否加化疗需充分知情"

  locally-advanced:
    - item: "PET/CT (远处转移评估)"
      priority: P0
      category: imaging
      reason: "III-IVA 期推荐 PET/CT 排除远处转移 + 指导靶区"
    - item: "鼻咽 MRI (放疗靶区 + 调强放疗 IMRT 规划)"
      priority: P0
      category: imaging
      reason: "同步放化疗 + 诱导化疗后再评估"
    - item: "血浆 EBV DNA 动态监测 (诱导化疗前后)"
      priority: P1
      category: lab
      reason: "诱导化疗疗效预测 + 个体化降阶 / 升阶决策"
    - item: "知情同意书 (诱导化疗 + 同步放化疗)"
      priority: P1
      category: consent
      reason: "PIPL + 临床合规"

  metastatic:
    - item: "血浆 EBV DNA (基线 + 动态监测)"
      priority: P0
      category: lab
      reason: "转移性 NPC 疗效监测 + 预后核心标志物"
    - item: "PD-L1 检测 (CPS / TPS)"
      priority: P1
      category: molecular
      reason: "免疫检查点抑制剂 (特瑞普利单抗 / 卡瑞利珠单抗) 参考"
    - item: "胸腹盆增强 CT + 骨扫描 / PET-CT"
      priority: P0
      category: imaging
      reason: "IVB 转移灶定位 (肝/肺/骨常见) + 疗效评估基线"
    - item: "知情同意书 (化疗 + 免疫治疗 + 临床试验)"
      priority: P1
      category: consent
      reason: "一线吉西他滨+顺铂联合 PD-1 抑制剂方案知情"

followup:
  - item: "随访血浆 EBV DNA 监测 (前 2 年每 3 个月)"
    priority: P1
    category: lab
  - item: "随访鼻咽 MRI + 颈部评估 + 甲状腺功能"
    priority: P1
    category: imaging
