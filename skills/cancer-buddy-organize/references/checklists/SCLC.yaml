# Small-Cell Lung Cancer (SCLC) — minimum data checklist
# Used by cancer-buddy-organize to generate missing_items.json
# Driven by NCCN SCLC 2024 + CSCO SCLC 2024

cancer_type: SCLC
version: SCLC-v1
last_updated: 2026-06-13
sources:
  - "NCCN Small Cell Lung Cancer v3.2024"
  - "CSCO 小细胞肺癌诊疗指南 2024"

# SCLC 分期沿用 VALG 二分法 (局限期 / 广泛期) 叠加 TNM。
# 分子标志物在 SCLC 价值有限,主要用于排除 NSCLC 转化与临床试验入组。

stages:
  all:
    - item: "病理报告 (确认小细胞癌 + IHC: CD56 / Syn / CgA / TTF-1 / Ki-67)"
      priority: P0
      category: pathology
      reason: "确诊神经内分泌小细胞癌 + 与 NSCLC / 类癌鉴别"
    - item: "胸部增强 CT"
      priority: P0
      category: imaging
      reason: "原发灶 + 纵隔淋巴结评估"
    - item: "脑 MRI 增强"
      priority: P0
      category: imaging
      reason: "SCLC 脑转发生率高,所有患者基线必查"
    - item: "PET-CT (全身)"
      priority: P0
      category: imaging
      reason: "区分局限期 / 广泛期 — 决定治疗策略"
    - item: "肿瘤标志物: NSE, ProGRP"
      priority: P1
      category: lab
      reason: "SCLC 特异性标志物,基线 + 疗效监测"
    - item: "血常规 + 肝肾功能 + 电解质 (含血钠)"
      priority: P1
      category: lab
      reason: "化疗安全 + 筛查 SIADH 低钠副瘤综合征"
    - item: "ECOG / PS 评分"
      priority: P1
      category: history
      reason: "化疗 / 放化疗耐受性评估"
    - item: "吸烟史 + 副瘤综合征症状问诊 (Lambert-Eaton / SIADH / 库欣)"
      priority: P2
      category: history
      reason: "SCLC 常合并副瘤综合征,影响处理"

  "limited-stage":
    - item: "肺功能检查 (PFT)"
      priority: P0
      category: lab
      reason: "同步放化疗前评估肺储备"
    - item: "颈胸腹盆增强 CT 或 PET-CT 明确单一放射野可覆盖"
      priority: P0
      category: imaging
      reason: "确认病灶可纳入一个安全放疗野 — 局限期定义核心"
    - item: "知情同意书 (同步放化疗)"
      priority: P1
      category: consent
      reason: "PIPL + 临床合规"

  "extensive-stage":
    - item: "PD-L1 IHC (背景参考,非强制)"
      priority: P2
      category: molecular
      reason: "免疫联合化疗 (阿替利珠单抗 / 度伐利尤单抗) 一线标准,PD-L1 不作筛选但供参考"
    - item: "肝脏 / 肾上腺 / 骨转移影像 (CT / MRI / 骨扫描)"
      priority: P0
      category: imaging
      reason: "广泛期转移负荷评估 + 疗效基线"
    - item: "DLL3 表达检测 (临床试验入组时)"
      priority: P2
      category: molecular
      reason: "Tarlatamab (DLL3 BiTE) 等在研 / 已批药物入组参考"
    - item: "知情同意书 (化免联合 + 基因/标志物检测)"
      priority: P1
      category: consent
      reason: "PIPL + 临床合规"

followup:
  - item: "随访胸部 CT (每 2-3 个月 × 第 1 年)"
    priority: P1
    category: imaging
  - item: "脑 MRI 随访 (预防性脑照射后或未行 PCI 者)"
    priority: P1
    category: imaging
  - item: "NSE / ProGRP 监测"
    priority: P2
    category: lab
