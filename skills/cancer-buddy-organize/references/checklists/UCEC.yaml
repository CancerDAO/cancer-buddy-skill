# Endometrial / Uterine Cancer (UCEC) — minimum data checklist
# Used by cancer-buddy-organize to generate missing_items.json
# Driven by NCCN Uterine Neoplasms 2024 + CSCO 子宫内膜癌 2024

cancer_type: UCEC
version: UCEC-v1
last_updated: 2026-06-13
sources:
  - "NCCN Uterine Neoplasms v2.2024"
  - "CSCO 子宫内膜癌诊疗指南 2024"
  - "FIGO 2023 Endometrial Cancer Staging"
  - "ESGO-ESTRO-ESP Endometrial Cancer Guidelines 2021"

# Items listed by stage context. The synthesis worker picks the closest-fit
# stage_context and unions any "all" items.
# Stage contexts: early (I-II) | advanced (III-IV/复发)
# TCGA/ProMisE 4 molecular subgroups: POLEmut / MMRd / NSMP(p53wt) / p53abn

stages:
  all:
    - item: "诊刮 / 子宫内膜活检病理 (含组织学类型 + 分级)"
      priority: P0
      category: pathology
      reason: "诊断 (内膜样 / 浆液性 / 透明细胞 / 癌肉瘤) + 分级"
    - item: "盆腔 MRI 增强 (肌层浸润深度 + 宫颈受累)"
      priority: P0
      category: imaging
      reason: "FIGO 局部分期 + 肌层浸润 >50% 评估"
    - item: "MMR / MSI 检测 (IHC: MLH1/MSH2/MSH6/PMS2)"
      priority: P0
      category: molecular
      reason: "分子分型 (MMRd 亚组) + 林奇综合征筛查 + 免疫治疗"
    - item: "p53 IHC (识别 p53abn 亚组)"
      priority: P0
      category: molecular
      reason: "分子分型 4 亚组之一 + 高危预后识别"
    - item: "POLE 突变检测 (核酸外切酶域)"
      priority: P1
      category: molecular
      reason: "POLEmut 亚组 (极佳预后, 可降阶治疗)"
    - item: "ER / PR 受体检测"
      priority: P1
      category: molecular
      reason: "内分泌治疗适用性 + NSMP 亚组分层"
    - item: "血常规 + 肝肾功能 + CA125"
      priority: P1
      category: lab
      reason: "治疗安全评估 + CA125 监测 (浆液性 / 晚期)"
    - item: "ECOG / PS 评分 + 合并症 (肥胖 / 糖尿病)"
      priority: P1
      category: history
      reason: "治疗方案选择 + 手术风险评估"

  early:
    - item: "经阴道超声 (内膜厚度 + 初筛)"
      priority: P2
      category: imaging
      reason: "初步评估 (确诊后价值有限)"
    - item: "保育意愿评估 (年轻 / 高分化内膜样)"
      priority: P2
      category: history
      reason: "孕激素保育治疗可行性"
    - item: "知情同意书 (手术分期 + 前哨淋巴结)"
      priority: P2
      category: consent
      reason: "全面分期手术知情"

  advanced:
    - item: "胸腹盆增强 CT 或 PET/CT (远处转移评估)"
      priority: P0
      category: imaging
      reason: "III-IV 期全身分期 + 转移灶定位"
    - item: "HER2 IHC / ISH 检测 (浆液性 / p53abn)"
      priority: P0
      category: molecular
      reason: "曲妥珠单抗联合化疗适用 (浆液性 HER2 阳性)"
    - item: "PD-L1 检测 (CPS) + dMMR 状态确认"
      priority: P0
      category: molecular
      reason: "帕博利珠单抗 / 多塔利单抗免疫治疗决策"
    - item: "NTRK 融合检测"
      priority: P2
      category: molecular
      reason: "拉罗替尼 / 恩曲替尼适用 (罕见)"
    - item: "知情同意书 (化疗 + 免疫 + 抗 HER2 + 基因检测)"
      priority: P1
      category: consent
      reason: "PIPL + 临床合规"

postoperative_followup:
  - item: "术后随访 CA125 监测 (浆液性 / 晚期)"
    priority: P1
    category: lab
  - item: "随访胸腹盆 CT / 盆腔 MRI (前 2-3 年每 3-6 个月)"
    priority: P1
    category: imaging
