# Pancreatic Ductal Adenocarcinoma (PDAC) — minimum data checklist
# Used by cancer-buddy-organize to generate missing_items.json
# Driven by NCCN Pancreatic Adenocarcinoma 2024 + CSCO 胰腺癌 2024
# 分期采用可切除性分层 (NCCN resectability): 可切除 / 交界可切除 / 局部进展 / 转移

cancer_type: PDAC
version: PDAC-v1
last_updated: 2026-06-13
sources:
  - "NCCN Pancreatic Adenocarcinoma v2.2024"
  - "CSCO 胰腺癌诊疗指南 2024"

stages:
  all:
    - item: "病理 / 细胞学报告 (EUS-FNA 或活检确诊腺癌)"
      priority: P0
      category: pathology
      reason: "确诊 + 与神经内分泌瘤 / 自身免疫性胰腺炎鉴别"
    - item: "胰腺增强 CT (胰腺专用方案 / 三期增强)"
      priority: P0
      category: imaging
      reason: "评估血管受累 — 可切除性分层的核心"
    - item: "肿瘤标志物: CA19-9 (+ CEA)"
      priority: P0
      category: lab
      reason: "基线 + 疗效与复发监测 (注意胆道梗阻时假性升高)"
    - item: "血常规 + 肝肾功能 + 胆红素 + 白蛋白"
      priority: P0
      category: lab
      reason: "梗阻性黄疸评估 + 化疗安全"
    - item: "胚系 BRCA1/2 + PALB2 检测 (所有确诊患者)"
      priority: P0
      category: molecular
      reason: "NCCN 推荐全部 PDAC 行胚系检测 — 铂类敏感 + 奥拉帕利维持 + 遗传咨询"
    - item: "营养评估 + 体重变化 + 糖尿病史"
      priority: P1
      category: history
      reason: "PDAC 恶病质常见,影响治疗耐受"
    - item: "ECOG / PS 评分"
      priority: P1
      category: history

  "resectable":
    - item: "胸部 CT (排除肺转移)"
      priority: P0
      category: imaging
      reason: "确认无远处转移方可手术"
    - item: "MSI / MMR + NTRK 检测 (组织足量时)"
      priority: P1
      category: molecular
      reason: "罕见但获批靶点 — 帕博利珠单抗 (dMMR) / 拉罗替尼 (NTRK)"
    - item: "知情同意书 (手术 ± 新辅助/辅助治疗)"
      priority: P1
      category: consent
      reason: "PIPL + 临床合规"

  "borderline-resectable":
    - item: "多学科 MDT 影像复核 (血管接触 < 180°)"
      priority: P0
      category: imaging
      reason: "交界可切除定义依赖血管受累程度判定"
    - item: "新辅助治疗前 EUS / 病理再确认"
      priority: P1
      category: pathology
      reason: "新辅助化疗 (FOLFIRINOX / 吉西他滨+白蛋白紫杉醇) 前需病理确诊"
    - item: "知情同意书 (新辅助治疗 + 计划性手术)"
      priority: P1
      category: consent
      reason: "PIPL + 临床合规"

  "locally-advanced":
    - item: "MSI / MMR 检测"
      priority: P0
      category: molecular
      reason: "免疫治疗 (dMMR/MSI-H) 适用性"
    - item: "胸部 CT + 必要时腹腔镜分期"
      priority: P1
      category: imaging
      reason: "排除隐匿转移 — 影响放化疗 vs 全身治疗决策"
    - item: "知情同意书 (诱导化疗 ± 放疗)"
      priority: P1
      category: consent
      reason: "PIPL + 临床合规"

  "metastatic":
    - item: "胚系 + 体系 NGS panel (BRCA1/2, PALB2, MSI, KRAS G12C, NTRK, NRG1)"
      priority: P0
      category: molecular
      reason: "维持/靶向治疗决策 — 奥拉帕利 / 帕博利珠单抗 / 索托拉西布 / NTRK 抑制剂"
    - item: "肝转移 / 腹膜影像 + 必要时活检"
      priority: P0
      category: imaging
      reason: "转移负荷基线 + 病理可重取以扩大 NGS"
    - item: "知情同意书 (基因检测 + 全身治疗)"
      priority: P1
      category: consent
      reason: "PIPL + 临床合规"

postoperative_followup:
  - item: "术后 CA19-9 监测 (每 3 个月 × 2 年)"
    priority: P1
    category: lab
  - item: "随访胸腹盆 CT (每 3-6 个月 × 2 年)"
    priority: P1
    category: imaging
