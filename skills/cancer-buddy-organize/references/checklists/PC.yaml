# Prostate Cancer (PC) — minimum data checklist
# Used by cancer-buddy-organize to generate missing_items.json
# Driven by NCCN Prostate 2024 + CSCO 前列腺癌 2024

cancer_type: PC
version: PC-v1
last_updated: 2026-06-13
sources:
  - "NCCN Prostate Cancer v4.2024"
  - "CSCO 前列腺癌诊疗指南 2024"
  - "EAU-EANM-ESTRO-ESUR-ISUP-SIOG Prostate Cancer Guidelines 2024"

# Items are listed by stage context. The synthesis worker picks the
# closest-fit stage_context and unions any "all" items.
# Stage contexts: localized (危险分组) | mHSPC (转移性激素敏感) | CRPC (去势抵抗)

stages:
  all:
    - item: "前列腺穿刺活检病理 (含 Gleason 评分 + ISUP 分级分组)"
      priority: P0
      category: pathology
      reason: "诊断 + 危险分组 + 治疗强度决策的核心依据"
    - item: "血清 PSA (总 PSA, 基线 + 治疗前)"
      priority: P0
      category: lab
      reason: "诊断 / 危险分组 / 疗效监测的核心标志物"
    - item: "睾酮 (血清总睾酮)"
      priority: P1
      category: lab
      reason: "评估去势状态 (去势水平 <50 ng/dL) + ADT 基线"
    - item: "血常规 + 肝肾功能 + 碱性磷酸酶 (ALP)"
      priority: P1
      category: lab
      reason: "治疗安全评估 + ALP 提示骨转移负荷"
    - item: "ECOG / PS 评分 + 合并症评估"
      priority: P1
      category: history
      reason: "治疗强度与方案选择 (尤其老年患者)"
    - item: "直肠指检 (DRE) 记录 + 临床 T 分期"
      priority: P1
      category: history
      reason: "局部分期 + 危险分组"

  localized:
    - item: "多参数前列腺 MRI (mpMRI, 含 PI-RADS 评分)"
      priority: P0
      category: imaging
      reason: "局部分期 (包膜外侵犯 / 精囊侵犯) + 靶向穿刺"
    - item: "危险分组所需穿刺阳性针数 / 占比"
      priority: P1
      category: pathology
      reason: "极低危 / 低危 / 中危 / 高危 / 极高危分组"
    - item: "高危 / 极高危: 骨扫描 (ECT) + 胸腹盆 CT 或 PSMA-PET"
      priority: P0
      category: imaging
      reason: "排除远处转移 (高危患者转移风险显著)"
    - item: "高危 / 极高危: 胚系 BRCA1/2 + HRR 基因检测"
      priority: P1
      category: molecular
      reason: "遗传风险评估 + 家族咨询 + 后续治疗规划"
    - item: "知情同意书 (主动监测 / 手术 / 放疗选择)"
      priority: P2
      category: consent
      reason: "局限期多种等效方案需充分知情"

  mHSPC:
    - item: "PSMA-PET/CT (68Ga-PSMA 或 18F-PSMA)"
      priority: P0
      category: imaging
      reason: "高灵敏度转移灶定位 + 寡转移 / 广泛转移分层"
    - item: "骨扫描 (ECT) + 胸腹盆增强 CT"
      priority: P0
      category: imaging
      reason: "转移负荷评估 (高/低瘤负荷决定是否联合化疗)"
    - item: "胚系 + 体系 BRCA1/2 / HRR 基因检测"
      priority: P0
      category: molecular
      reason: "PARP 抑制剂适用性 + 遗传咨询"
    - item: "知情同意书 (ADT + 联合治疗 + 基因检测)"
      priority: P1
      category: consent
      reason: "PIPL + 临床合规"

  CRPC:
    - item: "PSMA-PET/CT (评估 PSMA 表达用于核素治疗)"
      priority: P0
      category: imaging
      reason: "177Lu-PSMA-617 镭核素治疗适用性筛选"
    - item: "胚系 + 体系 BRCA1/2 / HRR 基因检测"
      priority: P0
      category: molecular
      reason: "PARP 抑制剂 (奥拉帕利 / 瑞卡帕替尼) 治疗决策"
    - item: "MSI / MMR 检测 (或 TMB)"
      priority: P1
      category: molecular
      reason: "dMMR/MSI-H 患者免疫治疗 (帕博利珠单抗) 适用"
    - item: "转移灶活检 (mCRPC 进展时)"
      priority: P2
      category: pathology
      reason: "排查神经内分泌 / 小细胞转化 (影响化疗方案)"
    - item: "睾酮复测 (确认维持去势水平)"
      priority: P1
      category: lab
      reason: "确认 CRPC 诊断前提 (去势水平下进展)"

postoperative_followup:
  - item: "术后 / 放疗后 PSA 监测 (前 2 年每 3 个月)"
    priority: P1
    category: lab
  - item: "生化复发评估 (PSA 升高时 PSMA-PET)"
    priority: P1
    category: imaging
