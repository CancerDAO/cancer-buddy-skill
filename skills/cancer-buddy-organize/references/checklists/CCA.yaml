# Cholangiocarcinoma (CCA) — minimum data checklist
# Used by cancer-buddy-organize to generate missing_items.json
# Driven by NCCN Biliary Tract Cancers 2024 + CSCO 胆道恶性肿瘤 2024 + ESMO
# 分肝内 (iCCA) 与肝外 (eCCA: 肝门部/远端),按可切除 / 进展分层

cancer_type: CCA
version: CCA-v1
last_updated: 2026-06-13
sources:
  - "NCCN Biliary Tract Cancers v3.2024"
  - "CSCO 胆道恶性肿瘤诊疗指南 2024"
  - "ESMO Biliary Tract Cancer Guidelines 2023"

stages:
  all:
    - item: "病理 / 细胞学报告 (确诊腺癌 + 解剖分型: 肝内 / 肝门部 / 远端)"
      priority: P0
      category: pathology
      reason: "解剖分型驱动手术方式与可切除性判断"
    - item: "上腹增强 MRI + MRCP (或胰腺方案增强 CT)"
      priority: P0
      category: imaging
      reason: "评估胆管受累范围 + 血管/肝实质侵犯"
    - item: "胸腹盆增强 CT"
      priority: P0
      category: imaging
      reason: "远处转移分期"
    - item: "肿瘤标志物: CA19-9 (+ CEA)"
      priority: P0
      category: lab
      reason: "基线 + 疗效监测 (胆道梗阻时可假性升高)"
    - item: "肝功能 + 胆红素 + 凝血 + 血常规"
      priority: P0
      category: lab
      reason: "梗阻性黄疸 / 肝储备评估"
    - item: "ECOG / PS 评分 + 胆管炎/黄疸病史"
      priority: P1
      category: history

  "intrahepatic-resectable":
    - item: "肝脏储备评估 (剩余肝体积测定 / ICG)"
      priority: P0
      category: imaging
      reason: "大范围肝切除前评估剩余肝功能"
    - item: "MSI / MMR 检测"
      priority: P1
      category: molecular
      reason: "免疫治疗适用性 + 林奇综合征筛查"
    - item: "知情同意书 (肝切除 ± 辅助卡培他滨)"
      priority: P1
      category: consent
      reason: "PIPL + 临床合规"

  "extrahepatic-resectable":
    - item: "胆道引流 + 胆汁/刷检细胞学 (肝门部梗阻)"
      priority: P0
      category: pathology
      reason: "减黄 + 病理获取"
    - item: "胆道镜 / EUS 评估纵向浸润范围"
      priority: P1
      category: imaging
      reason: "确定切除边界 (Bismuth-Corlette 分型)"
    - item: "知情同意书 (根治性切除 ± 辅助治疗)"
      priority: P1
      category: consent
      reason: "PIPL + 临床合规"

  "advanced":
    - item: "全面 NGS panel (FGFR2 融合, IDH1 突变, MSI, HER2, BRAF V600E, NTRK)"
      priority: P0
      category: molecular
      reason: "二线及以上靶向治疗决策 — pemigatinib/futibatinib (FGFR2) / ivosidenib (IDH1) / 曲妥珠单抗 (HER2) / 帕博利珠单抗 (dMMR)"
    - item: "FGFR2 融合检测 (肝内 CCA 优先,RNA-based 更敏感)"
      priority: P0
      category: molecular
      reason: "FGFR2 融合多见于 iCCA — FGFR 抑制剂获批靶点,DNA panel 易漏检"
    - item: "IDH1 突变检测"
      priority: P0
      category: molecular
      reason: "IDH1 R132 突变 — ivosidenib 适用,多见于 iCCA"
    - item: "PD-L1 / TMB (免疫联合参考)"
      priority: P2
      category: molecular
      reason: "度伐利尤单抗/帕博利珠单抗联合吉西他滨+顺铂一线标准,标志物供参考"
    - item: "可重取活检 (组织不足以完成 NGS 时)"
      priority: P1
      category: pathology
      reason: "靶点检测需足量组织 — FGFR2/IDH1 决定后线方案"
    - item: "知情同意书 (NGS 检测 + 全身/靶向治疗)"
      priority: P1
      category: consent
      reason: "PIPL + 临床合规"

followup:
  - item: "CA19-9 监测 (每 3-6 个月 × 2 年)"
    priority: P1
    category: lab
  - item: "随访上腹 MRI / 胸腹盆 CT (每 6 个月)"
    priority: P1
    category: imaging
