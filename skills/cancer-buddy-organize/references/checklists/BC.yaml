# Breast Cancer (BC) — minimum data checklist
# Driven by NCCN Breast 2024 + CSCO BC 2024

cancer_type: BC
version: BC-v1
last_updated: 2026-05-25
sources:
  - "NCCN Breast Cancer v4.2024"
  - "CSCO 乳腺癌诊疗指南 2024"

stages:
  all:
    - item: "病理报告 (含组织学 + 分级)"
      priority: P0
      category: pathology
    - item: "ER / PR / HER2 / Ki-67 IHC"
      priority: P0
      category: molecular
      reason: "分子分型 — 决定全身治疗路径"
    - item: "HER2 阳性: ISH (FISH) 确认"
      priority: P0
      category: molecular
      reason: "HER2 IHC 2+ 必须 FISH 复核"
    - item: "乳腺超声 + 双侧乳腺钼靶 (年龄 ≥ 35)"
      priority: P0
      category: imaging
    - item: "乳腺 MRI 增强 (年轻 / 致密腺体 / 多灶可疑)"
      priority: P1
      category: imaging
    - item: "胸腹 CT + 骨扫描 (≥ II 期 + 高危 I 期)"
      priority: P0
      category: imaging
      reason: "M 分期"
    - item: "血常规 + 肝肾功能"
      priority: P1
      category: lab
    - item: "心脏超声 (LVEF) — HER2 阳性必做"
      priority: P0
      category: lab
      reason: "曲妥珠单抗 / 帕妥珠单抗心脏毒性基线"

  "II-III":
    - item: "BRCA1/2 胚系检测 (家族史 / 年轻 / TNBC)"
      priority: P0
      category: molecular
      reason: "Olaparib 适用性 + 家族遗传咨询"
    - item: "腋窝淋巴结评估 (US ± FNA)"
      priority: P0
      category: imaging

  "IV":
    - item: "BRCA1/2 胚系 + 体细胞检测"
      priority: P0
      category: molecular
    - item: "PIK3CA 突变 (HR+ HER2-)"
      priority: P0
      category: molecular
      reason: "Alpelisib 适用性"
    - item: "ESR1 突变 (CDK4/6i 进展后, HR+)"
      priority: P1
      category: molecular
      reason: "Elacestrant 适用性"
    - item: "PD-L1 (TNBC, 22C3 / SP142)"
      priority: P0
      category: molecular
      reason: "免疫治疗适用性"
    - item: "HER2-low 状态 (IHC 1+ 或 2+/ISH-)"
      priority: P0
      category: molecular
      reason: "T-DXd 适用性"
    - item: "脑 MRI (出现神经症状 / HER2+)"
      priority: P1
      category: imaging
