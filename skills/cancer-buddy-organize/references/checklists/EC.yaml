# Esophageal Cancer (EC) — minimum data checklist
# Used by cancer-buddy-organize to generate missing_items.json
# Driven by NCCN Esophageal 2024 + CSCO 食管癌 2024 + ESMO
# 涵盖鳞癌 (ESCC) 与腺癌 (EAC / 含食管胃结合部 GEJ)

cancer_type: EC
version: EC-v1
last_updated: 2026-06-13
sources:
  - "NCCN Esophageal and Esophagogastric Junction Cancers v4.2024"
  - "CSCO 食管癌诊疗指南 2024"
  - "ESMO Oesophageal Cancer Guidelines 2022"

stages:
  all:
    - item: "胃镜 + 活检病理报告 (含组织学: 鳞癌 / 腺癌 + 分化程度)"
      priority: P0
      category: pathology
      reason: "鳞癌 vs 腺癌驱动治疗与标志物分流"
    - item: "肿瘤位置 + 距门齿距离 (内镜记录)"
      priority: P0
      category: history
      reason: "颈段/胸段/GEJ 定位影响放疗野与手术方式"
    - item: "胸腹盆增强 CT"
      priority: P0
      category: imaging
      reason: "T + N + M 分期"
    - item: "超声内镜 EUS (T + N 分期)"
      priority: P0
      category: imaging
      reason: "局部分期最精确 — 决定能否新辅助 / 直接手术"
    - item: "PET-CT (全身)"
      priority: P1
      category: imaging
      reason: "远处转移 + 新辅助疗效评估"
    - item: "血常规 + 肝肾功能 + 白蛋白"
      priority: P1
      category: lab
      reason: "治疗安全 + 营养状态"
    - item: "营养评估 + 吞咽困难分级 + 体重变化"
      priority: P1
      category: history
      reason: "食管癌营养不良常见,影响治疗耐受"
    - item: "ECOG / PS 评分"
      priority: P1
      category: history

  "I-II":
    - item: "颈部超声 / CT (胸上段 + 颈段鳞癌)"
      priority: P1
      category: imaging
      reason: "颈部淋巴结分期"
    - item: "MSI / MMR 检测 (腺癌)"
      priority: P1
      category: molecular
      reason: "免疫治疗适用性 + 林奇综合征筛查"

  "III":
    - item: "PD-L1 CPS (22C3) — 鳞癌优先"
      priority: P0
      category: molecular
      reason: "新辅助 / 围术期免疫治疗决策"
    - item: "HER2 IHC / ISH (腺癌 / GEJ)"
      priority: P0
      category: molecular
      reason: "曲妥珠单抗适用性"
    - item: "MSI / MMR 检测"
      priority: P1
      category: molecular
      reason: "免疫治疗适用 + 林奇筛查"
    - item: "知情同意书 (新辅助放化疗 / 围术期治疗)"
      priority: P1
      category: consent
      reason: "PIPL + 临床合规"

  "IV":
    - item: "PD-L1 CPS / TPS (22C3)"
      priority: P0
      category: molecular
      reason: "一线化免联合 (帕博利珠单抗 / 纳武利尤单抗) 适用性"
    - item: "HER2 IHC / ISH (腺癌 / GEJ)"
      priority: P0
      category: molecular
      reason: "曲妥珠单抗一线联合适用性"
    - item: "MSI / MMR 检测"
      priority: P0
      category: molecular
      reason: "免疫治疗适用性"
    - item: "Claudin 18.2 IHC (腺癌 / GEJ)"
      priority: P1
      category: molecular
      reason: "Zolbetuximab (CLDN18.2+ HER2-) 适用性"
    - item: "NTRK 融合检测"
      priority: P2
      category: molecular
      reason: "拉罗替尼 / 恩曲替尼适用 (罕见但泛癌种获批)"
    - item: "知情同意书 (基因/标志物检测 + 治疗)"
      priority: P1
      category: consent
      reason: "PIPL + 临床合规"

postoperative_followup:
  - item: "随访胸腹盆 CT (每 6-12 个月)"
    priority: P1
    category: imaging
  - item: "胃镜随访 (新辅助 + 术后吻合口监测)"
    priority: P2
    category: imaging
