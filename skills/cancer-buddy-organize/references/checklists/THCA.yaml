# Thyroid Cancer (THCA) — minimum data checklist
# Used by cancer-buddy-organize to generate missing_items.json
# Driven by NCCN Thyroid Carcinoma 2024 + CSCO 甲状腺癌 2024

cancer_type: THCA
version: THCA-v1
last_updated: 2026-06-13
sources:
  - "NCCN Thyroid Carcinoma v4.2024"
  - "CSCO 甲状腺癌诊疗指南 2024"
  - "2015 ATA Differentiated Thyroid Cancer Guidelines"
  - "2015 ATA Medullary Thyroid Carcinoma Guidelines"

# Items listed by histology context. The synthesis worker picks the closest-fit
# context and unions any "all" items.
# Histology contexts: DTC (分化型: 乳头状/滤泡状) | MTC (髓样癌) | ATC (未分化癌)

stages:
  all:
    - item: "甲状腺细针穿刺 (FNA) 细胞学 (Bethesda 分级)"
      priority: P0
      category: pathology
      reason: "诊断 + 良恶性判定 + 手术决策"
    - item: "颈部超声 (结节特征 + 颈部淋巴结评估)"
      priority: P0
      category: imaging
      reason: "结节 TI-RADS 分级 + 淋巴结分期 (中央区/侧区)"
    - item: "甲状腺功能 (TSH, FT3, FT4)"
      priority: P1
      category: lab
      reason: "基线甲功 + 术后 TSH 抑制治疗目标设定"
    - item: "ECOG / PS 评分"
      priority: P1
      category: history
      reason: "治疗方案选择 (尤其晚期 / 老年)"
    - item: "术后病理 (组织学类型 + 包膜 / 脉管侵犯 + 切缘)"
      priority: P0
      category: pathology
      reason: "确诊分型 + 危险分层 (复发风险)"

  DTC:
    - item: "甲状腺球蛋白 (Tg) + 抗甲状腺球蛋白抗体 (TgAb)"
      priority: P0
      category: lab
      reason: "DTC 术后随访核心标志物 (TgAb 干扰需同测)"
    - item: "BRAF V600E 突变检测 (尤其细胞学不确定 / 进展期)"
      priority: P1
      category: molecular
      reason: "诊断辅助 + 达拉非尼+曲美替尼靶向治疗适用"
    - item: "RET 融合检测 (碘难治 / 进展期)"
      priority: P1
      category: molecular
      reason: "塞普替尼 (selpercatinib) 靶向治疗适用"
    - item: "NTRK 融合检测 (碘难治 / 进展期)"
      priority: P2
      category: molecular
      reason: "拉罗替尼 / 恩曲替尼适用"
    - item: "碘难治评估: 诊断性全身碘扫描 (Dx-WBS)"
      priority: P1
      category: imaging
      reason: "判断放射性碘 (RAI) 难治 → 转靶向治疗"
    - item: "知情同意书 (手术 + RAI + TSH 抑制)"
      priority: P2
      category: consent
      reason: "治疗方案充分知情"

  MTC:
    - item: "降钙素 (Calcitonin) + 癌胚抗原 (CEA)"
      priority: P0
      category: lab
      reason: "MTC 诊断 + 术前肿瘤负荷 + 术后随访核心标志物"
    - item: "胚系 RET 突变检测 (遗传性筛查)"
      priority: P0
      category: molecular
      reason: "鉴别遗传性 (MEN2) vs 散发 + 家族咨询 + 靶向治疗"
    - item: "嗜铬细胞瘤筛查 (血/尿甲氧基肾上腺素)"
      priority: P0
      category: lab
      reason: "RET 阳性需排除 MEN2 相关嗜铬细胞瘤 (术前必查)"
    - item: "颈部增强 CT / 进展期 PET (含 FDG / DOTA)"
      priority: P1
      category: imaging
      reason: "局部 + 远处分期 (肝/肺/骨转移)"
    - item: "体系 RET 检测 (散发性进展期)"
      priority: P1
      category: molecular
      reason: "塞普替尼靶向治疗适用 (RET M918T 等)"

  ATC:
    - item: "BRAF V600E 突变检测 (急查)"
      priority: P0
      category: molecular
      reason: "达拉非尼+曲美替尼是 BRAF 阳性 ATC 关键方案 (需尽快)"
    - item: "颈部 + 胸腹增强 CT / PET-CT (快速分期)"
      priority: P0
      category: imaging
      reason: "ATC 进展极快, 需紧急全身分期 + 气道评估"
    - item: "NTRK / RET / NGS 全面检测"
      priority: P1
      category: molecular
      reason: "多靶点筛查指导紧急靶向 / 临床试验"
    - item: "气道评估 (喉镜 / 气管受压)"
      priority: P0
      category: imaging
      reason: "ATC 常致气道梗阻, 影响紧急处理决策"
    - item: "知情同意书 (紧急多学科 + 靶向 + 临床试验)"
      priority: P1
      category: consent
      reason: "PIPL + 临床合规 (进展快需快速决策)"

postoperative_followup:
  - item: "DTC: 术后 Tg/TgAb 监测 + TSH 抑制达标评估"
    priority: P1
    category: lab
  - item: "MTC: 术后降钙素 / CEA 倍增时间监测"
    priority: P1
    category: lab
