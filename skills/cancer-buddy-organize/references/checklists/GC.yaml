# Gastric Cancer (GC) — minimum data checklist
# Driven by NCCN Gastric 2024 + CSCO 胃癌 2024

cancer_type: GC
version: GC-v1
last_updated: 2026-05-25
sources:
  - "NCCN Gastric Cancer v2.2024"
  - "CSCO 胃癌诊疗指南 2024"

stages:
  all:
    - item: "胃镜 + 活检病理报告 (含 Lauren 分型)"
      priority: P0
      category: pathology
    - item: "HER2 IHC / ISH"
      priority: P0
      category: molecular
      reason: "曲妥珠单抗适用性 — 必须每例做"
    - item: "MSI / MMR 检测"
      priority: P0
      category: molecular
      reason: "免疫治疗适用 + 林奇综合征筛查"
    - item: "PD-L1 CPS (22C3)"
      priority: P0
      category: molecular
      reason: "Nivolumab / Pembrolizumab 适用性 (CPS ≥ 5)"
    - item: "胸腹盆增强 CT"
      priority: P0
      category: imaging
    - item: "超声内镜 EUS (T + N 分期)"
      priority: P1
      category: imaging
      reason: "局部分期更精确"
    - item: "腹腔镜分期 (≥ T3 或 N+)"
      priority: P1
      category: imaging
      reason: "腹膜转移检出"
    - item: "血常规 + 肝肾功能 + 白蛋白"
      priority: P1
      category: lab
    - item: "营养评估 + 体重变化"
      priority: P1
      category: history

  "IV":
    - item: "Claudin 18.2 IHC"
      priority: P0
      category: molecular
      reason: "Zolbetuximab (CLDN18.2+ HER2-) 适用性"
    - item: "EBV 检测 (RNA in situ hybridization)"
      priority: P1
      category: molecular
      reason: "免疫治疗高反应亚型"
    - item: "腹水细胞学 (有腹水时)"
      priority: P0
      category: pathology
      reason: "M1 确认 + 腹腔灌注决策"
