# Ground truth for SYNTHETIC-example/page-001.pdf (generated by make_fixture.py).
# Fully synthetic. Every value below is also literally present in the page's embedded
# text layer, so this file can be re-derived from the PDF without trusting any model —
# which is what makes it usable as a worked example of the format.
source_id: SYN001
page: 1
text_layer_kind: born_digital
doc_kind: 检验报告
clinical_class: lab

# Only the 12 high-risk classes are ground-truthed. `value` is verbatim, exactly as the
# page prints it — normalization is the evaluator's declared policy, never the truth.
fields:
  - label: Report date
    value: "2026-03-15"
    high_risk_class: date
  - label: Accession
    value: "SYN-0000001"
    high_risk_class: accession
  - label: WBC
    value: "3.21"
    unit: "10^9/L"
    high_risk_class: lab_value
  - label: WBC ref
    value: "3.50-9.50"
    high_risk_class: reference_range
  - label: HGB
    value: "128"
    unit: "g/L"
    high_risk_class: lab_value
  - label: PLT
    value: "185"
    unit: "10^9/L"
    high_risk_class: lab_value
  - label: CEA
    value: "25.3"
    unit: "ng/mL"
    high_risk_class: lab_value
  - label: CEA ref
    value: "0.00-5.00"
    high_risk_class: reference_range

# Spot-check tokens for 全文召回率. Not a transcript: a complete transcription must
# CONTAIN these, and the metric never attempts a full-text diff.
full_text_tokens:
  - "SYNTHETIC CLINIC"
  - "BLOOD COUNT REPORT"
  - "WBC"
  - "3.21"
  - "ref 3.50-9.50"
  - "HGB"
  - "128"
  - "CEA"
  - "25.3"
  - "Reviewed by"

# Non-null on the two PT-84 regression pages; null here because this page has no defect.
known_defect: null
